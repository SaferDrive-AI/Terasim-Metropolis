{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "terasim-phase1.serviceAccountName" . }}
  labels:
    {{- include "terasim-phase1.labels" (dict "root" . "component" "service-account") | nindent 4 }}
{{- with (include "terasim-phase1.imagePullSecrets" .) }}
{{ . }}
{{- end }}
{{- end }}

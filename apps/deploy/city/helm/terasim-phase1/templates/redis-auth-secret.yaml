{{- /*
Redis requirepass. Created only when the operator does not bring their own
Secret (redis.auth.existingSecret). The value is redis.auth.password or, when
empty, generated once and reused on every upgrade (lookup). Kept on uninstall
(resource-policy keep) so a re-install of the same release keeps the password;
delete the Secret by hand to start over.
*/}}
{{- if and .Values.redis.auth.enabled (not .Values.redis.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "terasim-phase1.redisAuthSecretName" . }}
  labels:
    {{- include "terasim-phase1.labels" (dict "root" . "component" "redis") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.redis.auth.secretKey }}: {{ include "terasim-phase1.redisAuthPassword" . | b64enc | quote }}
{{- end }}

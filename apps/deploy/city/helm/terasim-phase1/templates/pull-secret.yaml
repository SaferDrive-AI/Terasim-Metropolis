{{- if .Values.pullSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.pullSecret.name }}
  labels:
    {{- include "terasim-phase1.labels" (dict "root" . "component" "pull-secret") | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{%q:{\"username\":%q,\"password\":%q,\"auth\":%q}}}" .Values.pullSecret.registry .Values.pullSecret.username .Values.pullSecret.password (printf "%s:%s" .Values.pullSecret.username .Values.pullSecret.password | b64enc) | b64enc }}
{{- end }}

{{- /*
`helm test` smoke: a short-lived pod that checks all three services answer.
Uses the same image (curl/python present). Fails (non-zero) if any check fails.
*/}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "terasim-phase1.fullname" . }}-test
  labels:
    {{- include "terasim-phase1.labels" (dict "root" . "component" "test") | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  serviceAccountName: {{ include "terasim-phase1.serviceAccountName" . }}
  {{- include "terasim-phase1.imagePullSecrets" . | nindent 2 }}
  restartPolicy: Never
  {{- with .Values.podSecurityContext }}
  securityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: test
      image: {{ include "terasim-phase1.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      command: ["python", "-c"]
      args:
        - |
          import sys, urllib.request
          checks = [
              ("service", "http://{{ include "terasim-phase1.serviceHost" . }}:{{ .Values.service.port }}/openapi.json"),
              ("tmc", "http://{{ include "terasim-phase1.tmcHost" . }}:{{ .Values.tmc.port }}/v1/tmc/health"),
          ]
          bad = []
          for name, url in checks:
              try:
                  code = urllib.request.urlopen(url, timeout=15).getcode()
                  print(name, url, code)
                  if code != 200:
                      bad.append((name, code))
              except Exception as exc:
                  print(name, url, "ERR", exc); bad.append((name, str(exc)))
          # MCP: a GET on /mcp is a 4xx (protocol needs POST) but proves it listens.
          import socket
          s = socket.socket(); s.settimeout(15)
          try:
              s.connect(("{{ include "terasim-phase1.mcpHost" . }}", {{ .Values.mcp.port }})); print("mcp tcp ok")
          except Exception as exc:
              print("mcp tcp ERR", exc); bad.append(("mcp", str(exc)))
          finally:
              s.close()
          {{- if or .Values.redis.auth.enabled .Values.networkPolicy.enabled }}
          # Redis must not answer an unauthenticated PING from this pod: the
          # NetworkPolicy keeps it out (connect fails) or requirepass answers
          # NOAUTH. A bare +PONG means the snapshot buffer is open.
          s = socket.socket(); s.settimeout(10)
          try:
              s.connect(("{{ include "terasim-phase1.redisHost" . }}", 6379))
              s.sendall(b"PING\r\n"); reply = s.recv(128)
              print("redis unauthenticated PING ->", reply)
              if reply.startswith(b"+PONG"):
                  bad.append(("redis", "answered an unauthenticated PING"))
          except Exception as exc:
              print("redis not reachable from the test pod (expected with the NetworkPolicy):", exc)
          finally:
              s.close()
          {{- end }}
          sys.exit(1 if bad else 0)

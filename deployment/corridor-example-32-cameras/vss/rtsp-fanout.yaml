apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtsp-fanout
  labels: {app: rtsp-fanout}
spec:
  replicas: 1
  selector: {matchLabels: {app: rtsp-fanout}}
  template:
    metadata:
      labels: {app: rtsp-fanout}
      annotations:
        checksum/config: 04483595e5413c0c
    spec:
      containers:
        - name: mediamtx
          image: bluenviron/mediamtx:1.21.2
          args: [/config/mediamtx.yml]
          ports:
            - {name: rtsp, containerPort: 8554}
          # restricted-v2 compatible (OpenShift assigns the uid); plain Kubernetes: add runAsUser.
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
      volumes:
        - name: config
          configMap: {name: rtsp-fanout}
---
apiVersion: v1
kind: Service
metadata:
  name: rtsp-fanout
  labels: {app: rtsp-fanout}
spec:
  selector: {app: rtsp-fanout}
  ports:
    - {name: rtsp, port: 8554, targetPort: 8554}

[project]
name = "terasim-agent-skill"
version = "0.1.0"
description = "Agent-facing client and MCP server for the TeraSim city signal-optimization API"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "Inchor", email = "dev@inchor.ai"},
]
dependencies = [
    "httpx>=0.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0,<2",
    # The MCP server (and its /files download route) runs on Starlette via
    # FastMCP; 1.3.1 closes the 2025/2026 Starlette CVEs.
    "starlette>=1.3.1",
]
# The signal-controller-style timing report PDF (terasim_agent_skill.timing_report),
# rendered by the MCP server for the download links in a chat answer.
report = [
    "reportlab>=4,<6",
]
dev = [
    "pytest>=7.4",
]

[project.scripts]
terasim-agent-skill = "terasim_agent_skill.server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["terasim_agent_skill*"]
